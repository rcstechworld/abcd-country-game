apiVersion: apps/v1
kind: Deployment
metadata:
  name: abcd-game
  labels:
    app: abcd-game
spec:
  replicas: 2
  selector:
    matchLabels:
      app: abcd-game
  template:
    metadata:
      labels:
        app: abcd-game
    spec:
      containers:
      - name: abcd-game
        image: YOUR_ACR.azurecr.io/abcd/v1:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: abcd-game
spec:
  selector:
    app: abcd-game
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
